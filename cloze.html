const KEY='english-cloze-quiz-v1';const fresh=()=>({pos:0,answers:{},checked:{},completed:[]});
function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return fresh()}}let state=load();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s||'').trim().toLowerCase().replace(/[.，,;；]+$/,'').replace(/\s+/g,' ')}
function render(){const q=questions[state.pos],values=state.answers[q.n]||Array(q.a.length).fill(''),checked=state.checked[q.n];document.getElementById('stats').textContent=`原卷可见 ${questions.length} 组 · 已完成 ${state.completed.length} 组 · 当前第 ${state.pos+1} 组`;document.getElementById('bar').style.width=((state.pos+1)/questions.length*100)+'%';let inputs=q.a.map((_,i)=>`<label><span>${i+1}</span><input data-i="${i}" value="${esc(values[i]||'')}" placeholder="第 ${i+1} 空" ${checked?'disabled':''}></label>`).join('');let feedback='';if(checked){const wrong=q.a.map((x,i)=>norm(values[i])===norm(x)).filter(x=>!x).length;feedback=`<div class="feedback ${wrong?'bad':'ok'}"><b>${wrong?`有 ${wrong} 空需要订正`:'全部正确'}</b><br>参考答案：${q.a.map((x,i)=>`${i+1}. ${x}`).join('　')}</div>`}document.getElementById('card').innerHTML=`<div class="question-head"><b>原卷第 ${q.n} 组</b><span>${q.a.length} 个空</span></div><img class="scan" src="${IMAGE_DATA[q.n]}" alt="第 ${q.n} 组段落填空"><div class="hint">已去掉纸张边缘、考试系统栏、计时和重复截图。请按图片中空格从左到右、从上到下填写，进度会自动保存。</div><div class="answers">${inputs}</div>${feedback}<div class="nav"><button class="btn" id="prev" ${state.pos===0?'disabled':''}>上一组</button>${checked?'<button class="btn primary" id="next">下一组</button>':'<button class="btn primary" id="check">检查答案</button>'}</div>`;document.querySelectorAll('input[data-i]').forEach(el=>el.oninput=()=>{const a=state.answers[q.n]||Array(q.a.length).fill('');a[+el.dataset.i]=el.value;state.answers[q.n]=a;save()});document.getElementById('prev').onclick=()=>{if(state.pos>0){state.pos--;save();render()}};const check=document.getElementById('check');if(check)check.onclick=()=>{state.checked[q.n]=true;if(!state.completed.includes(q.n))state.completed.push(q.n);save();render()};const next=document.getElementById('next');if(next)next.onclick=()=>{state.pos=(state.pos+1)%questions.length;save();render()}}render();
