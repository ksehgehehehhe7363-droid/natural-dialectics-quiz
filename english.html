B":"繁荣","C":"毕业典礼","D":"满足；知足"},"note":"原句含否定 I do not ... suppose，意思是“不认为所有人都过着特权安稳、心满意足的生活”；contentment 与 privilege 并列。"},{"num":142,"stem":"Of course it was impossible to connect the dots looking forward when I was in college. But it was very, very clear looking ______ ten years later.","opts":{"A":"upwards","B":"inwards","C":"downwards","D":"backwards"},"ans":"D","explanation":"正确选项是 D（backwards）。填入后的完整句子：Of course it was impossible to connect the dots looking forward when I was in college But it was very,very clear looking backwards ten yearslater 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：Of course it was impossible to connect the dots looking forward when I was in college But it was very,very clear looking ______ ten yearslater\nA. upwards\nB. inwards\nC. downwards\nD. backwards","contextTranslation":"当然，我在大学时不可能向前看就把这些点连起来；但十年后回头看，一切都非常清楚。","optionZh":{"A":"向上","B":"向内","C":"向下","D":"向后；回顾"},"note":"looking backwards 与 looking forward 对照，表示“十年后回头看”。"},{"num":143,"stem":" ______ a commencement address is a great responsibility.","opts":{"A":"depressing","B":"delivering","C":"defending","D":"descending"},"ans":"B","explanation":"正确选项是 B（delivering）。填入后的完整句子： delivering a commencement address is a great responsibility. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干： ______ a commencement address is a great responsibility.\nA. depressing\nB. delivering\nC. defending\nD. descending","contextTranslation":"发表毕业典礼致辞是一项重大责任。","optionZh":{"A":"令人沮丧的","B":"发表；作（演讲）","C":"保卫","D":"下降"},"note":"动名词短语 Delivering a commencement address 作句子主语，意为“发表毕业演讲”。"},{"num":144,"stem":"I really didn't know what to do for a few months. I felt that I had let the previous generation of entrepreneurs ______—that I had dropped the baton as it was being passed to me.","opts":{"A":"on","B":"in","C":"down","D":"out"},"ans":"C","explanation":"正确选项是 C（down）。填入后的完整句子：I really didn't know what to do for a few months.I felt that I had let the previous generation of entrepreneurs down -- that I had dropped the baton as it was being passed to me 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：I really didn't know what to do for a few months.I felt that I had let the previous generation of entrepreneurs ______ -- that I had dropped the baton as it was being passed to me\nA. on\nB. in\nC. down\nD. out","contextTranslation":"有几个月我真的不知道该怎么办。我觉得我让上一代企业家失望了——当接力棒传给我时，我已经把它丢掉了。","optionZh":{"A":"继续；在……上面","B":"进入","C":"使失望","D":"在外"},"note":"let somebody down 是固定短语，表示“让某人失望”。"},{"num":145,"stem":"So, given a Time Turner, I would tell my 21-year-old self that personal happiness lies in knowing that life is not a check-list of ______ or achievement.","opts":{"A":"qualification","B":"acquisition","C":"adversity","D":"humility"},"ans":"B","explanation":"正确选项是 B（acquisition）。填入后的完整句子：So given a Time Turner, I would tell my 21-year-old self that personal happiness lies inknowing thatlife isnota check-list of acquisition orachievement 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：So given a Time Turner, I would tell my 21-year-old self that personal happiness lies inknowing thatlife isnota check-list of ______ orachievement\nA. qualification\nB. acquisition\nC. adversity\nD. humility","contextTranslation":"所以，如果有一个时间转换器，我会告诉 21 岁的自己：个人幸福在于明白，生活不是一张获取物或成就的清单。","optionZh":{"A":"资格","B":"获取；获得物","C":"逆境","D":"谦逊"},"note":"acquisition 与 achievement 并列，表示“获取物与成就”；原文强调人生并非核对这些项目的清单。"},{"num":146,"stem":"When I was 17, I read a ______ that went something like this.","opts":{"A":"quote","B":"notion","C":"concept","D":"piece"},"ans":"A","explanation":"正确选项是 A（quote）。填入后的完整句子：When I was 17, I read a quote that went something like this. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：When I was 17, I read a ______ that went something like this.\nA. quote\nB. notion\nC. concept\nD. piece","contextTranslation":"当我17岁的时候，我读到过这样一句话。","optionZh":{"A":"引语；名言","B":"观念","C":"概念","D":"一篇；一件"}},{"num":147,"stem":"Amnesty ______ thousands of people who have never been tortured or imprisoned for their beliefs to act on behalf of those who have.","opts":{"A":"persuades","B":"asks","C":"calls","D":"mobilises"},"ans":"D","explanation":"正确选项是 D（mobilises）。填入后的完整句子：Amnesty mobilises thousands of people to act on behalf of those who have been tortured or imprisoned. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：Amnesty ______ thousands of people to act on behalf of those who have been tortured or imprisoned.\nA. persuades\nB. asks\nC. calls\nD. mobilises","contextTranslation":"国际特赦组织动员成千上万从未因信仰遭受酷刑或监禁的人，为那些有过此种遭遇的人采取行动。","optionZh":{"A":"说服","B":"请求","C":"呼叫","D":"动员"},"note":"mobilise somebody to do something 表示“动员某人做某事”，符合国际特赦组织组织公众行动的语境。"},{"num":148,"stem":"And yet death is the ______ we all share. No one has ever escaped it.","opts":{"A":"interaction","B":"destination","C":"information","D":"tradition"},"ans":"B","explanation":"正确选项是 B（destination）。填入后的完整句子：And yet death is the destination we all share. No one has ever escaped it. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：And yet death is the ______ we all share. No one has ever escaped it.\nA. interaction\nB. destination\nC. information\nD. tradition","contextTranslation":"然而死亡是我们共同的目的地。没有人能够逃脱它。","optionZh":{"A":"互动","B":"终点；归宿","C":"信息","D":"传统"}},{"num":149,"stem":"I had a daughter that I ______ and I had an old typewriter and a big idea. And so rock bottom became the solid foundation on which I rebuilt my life.","opts":{"A":"adored","B":"advocated","C":"admired","D":"alarmed"},"ans":"A","explanation":"正确选项是 A（adored）。填入后的完整句子：I had a daughter that I adored and I had an old typewriter and a big idea. And so rock bottom became the solid foundation on which I rebuilt my life. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：I had a daughter that I ______ and I had an old typewriter and a big idea. And so rock bottom became the solid foundation on which I rebuilt my life.\nA. adored\nB. advocated\nC. admired\nD. alarmed","contextTranslation":"我有一个我深爱的女儿，我有一台旧打字机和一个伟大的想法。因此，谷底成了我重建生活的坚实基础。","optionZh":{"A":"深爱","B":"提倡","C":"钦佩","D":"使惊恐"}},{"num":150,"stem":"Though I personally will ______ the value of bedtime stories to my last gasp.","opts":{"A":"protect","B":"keep","C":"defend","D":"love"},"ans":"C","explanation":"正确选项是 C（defend）。填入后的完整句子：Though I personally will defend the value of bedtime stories to my last gasp 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：Though I personally will ______ the value of bedtime stories to my last gasp\nA. protect\nB. keep\nC. defend\nD. love","contextTranslation":"尽管我个人会捍卫睡前故事的价值直到最后一口气","optionZh":{"A":"保护","B":"保持","C":"捍卫","D":"爱"}},{"num":151,"stem":"Maybe he was so ______ and unapproachable that no one dared or cared to thank him.","opts":{"A":"certifiable","B":"clinical","C":"critical","D":"clerical"},"ans":"C","explanation":"正确选项是 C（critical）。填入后的完整句子：Maybe he was so critical and unapproachable that no one dared or cared to thank him. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：Maybe he was so ______ and unapproachable that no one dared or cared to thank him.\nA. certifiable\nB. clinical\nC. critical\nD. clerical","contextTranslation":"也许他太挑剔、太难以接近，以至于没人敢、也不在乎感谢他。","optionZh":{"A":"可证明为精神失常的","B":"临床的；冷冰冰的","C":"挑剔的；批评的","D":"文书工作的"}},{"num":152,"stem":"For Steve Jobs, great products were to be technologically ______, and they were to be equally beautiful.","opts":{"A":"complex","B":"attractive","C":"acceptable","D":"exceptional"},"ans":"D","explanation":"正确选项是 D（exceptional）。填入后的完整句子：For Steve Jobs great products were to be technologically exceptional , and they were to be equally beautiful. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：For Steve Jobs great products were to be technologically ______ , and they were to be equally beautiful.\nA. complex\nB. attractive\nC. acceptable\nD. exceptional","contextTranslation":"对于史蒂夫·乔布斯来说，伟大的产品不仅要有卓越的技术，而且要同样美丽。","optionZh":{"A":"复杂的","B":"有吸引力的","C":"可接受的","D":"卓越的；非凡的"}},{"num":153,"stem":"To ______ grateful children, we have to be grateful.","opts":{"A":"lift","B":"raise","C":"rise","D":"arise"},"ans":"B","explanation":"正确选项是 B（raise）。填入后的完整句子：To raise grateful children, we have to be grateful. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：To ______ grateful children, we have to be grateful.\nA. lift\nB. raise\nC. rise\nD. arise","contextTranslation":"为了培养感恩的孩子，我们必须心怀感恩。","optionZh":{"A":"举起","B":"抚养；培养","C":"上升","D":"出现；产生"},"note":"raise children 表示“抚养、培养孩子”；rise/arise 都是不及物动词，不能直接接 children。"},{"num":154,"stem":"My ______ to my iPad was first imagined in the Apple labs.","opts":{"A":"existence","B":"reaction","C":"promise","D":"distortion"},"ans":"B","explanation":"正确选项是 B（reaction）。填入后的完整句子：My reaction to my iPad was first imagined in the Apple labs. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：My ______ to my iPad was first imagined in the Apple labs.\nA. existence\nB. reaction\nC. promise\nD. distortion","contextTranslation":"我对 iPad 的反应最初是在 Apple 实验室中想象出来的。","optionZh":{"A":"存在","B":"反应","C":"承诺","D":"扭曲"}},{"num":155,"stem":"My father would almost have ______ for Aristotle's description of the ideal man.","opts":{"A":"favored","B":"qualified","C":"accepted","D":"described"},"ans":"B","explanation":"正确选项是 B（qualified）。填入后的完整句子：My father would almost have qualified for Aristotle's description of the ideal man. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干：My father would almost have ______ for Aristotle's description of the ideal man.\nA. favored\nB. qualified\nC. accepted\nD. described","contextTranslation":"我父亲几乎符合亚里士多德对理想男人的描述。","optionZh":{"A":"偏爱","B":"符合条件","C":"接受","D":"描述"},"note":"qualify for 表示“符合……的条件/标准”；句中说父亲几乎符合亚里士多德对理想人物的描述。"}];
const byNum=new Map(qs.map(q=>[q.num,q]));
const KEY='english-choice-quiz-v4';
const initial=()=>({mode:'study',sequence:qs.map(q=>q.num),pos:0,answers:{},wrong:[],total:0,correctTotal:0,runCorrect:0,runAnswered:0,selected:null,feedback:null,wrongShuffle:false});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.sequence)&&s.sequence.length&&s.sequence.every(n=>byNum.has(n)))return {...initial(),...s};}catch(e){}return initial()}
let state=load();let autoTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function shuffled(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function setMode(mode,sequence){clearTimeout(autoTimer);state.mode=mode;state.sequence=sequence;state.pos=0;state.selected=null;state.feedback=null;state.runCorrect=0;state.runAnswered=0;save();render()}
function startStudy(){setMode('study',qs.map(q=>q.num))}
function startRandom(){setMode('exam',shuffled(qs.map(q=>q.num)).slice(0,100))}
function startWrong(){let ids=state.wrong.slice();if(state.wrongShuffle)ids=shuffled(ids);setMode('wrong',ids)}
function current(){return byNum.get(state.sequence[state.pos])}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatStem(s){return escapeHtml(s).replaceAll('______','<span class="blank" aria-label="填空处">______</span>')}
function parseOptionZh(q){
 if(q.optionZh)return q.optionZh;
 const out={};
 for(const line of String(q.translation||'').split('\n')){const m=line.match(/^([A-D])[.．、]\s*(.+)$/);if(m)out[m[1]]=m[2].trim()}
 return out;
}
function grammarHint(q){
 const before=q.stem.split('______')[0].trim();
 if(/\b(to|can|could|would|should|might|must|will)\s*$/i.test(before))return '空格处需要动词原形或与前词构成完整短语';
 if(/\b(has|have|had)\s*$/i.test(before))return '空格处需要过去分词，与前面的完成时结构衔接';
 if(/\b(a|an|the|my|your|his|her|their|our)\s*$/i.test(before))return '空格处需要名词或能修饰后续名词的成分';
 if(/\b(is|am|are|was|were|be|been)\s*$/i.test(before))return '空格处需要表语或过去分词，使系表或被动结构完整';
 return '空格处既要符合句法结构，也要与上下文语义一致';
}
function detailedExplanation(q){
 const zh=parseOptionZh(q),answerZh=zh[q.ans]||q.opts[q.ans];
 const full=q.stem.replace('______',q.opts[q.ans]);
 const special=q.note||('“'+q.opts[q.ans]+'”在这里意为“'+answerZh+'”，'+grammarHint(q)+'；填入后与整句所表达的语境一致。');
 const wrong='ABCD'.split('').filter(k=>k!==q.ans).map(k=>'• '+k+'. '+q.opts[k]+'：意为“'+(zh[k]||q.opts[k])+'”，放入本句后会造成词义、搭配或句法与原文语境不符。').join('\n');
 return '<b>正确答案</b><br>'+q.ans+'. '+escapeHtml(q.opts[q.ans])+'（'+escapeHtml(answerZh)+'）<br><br><b>完整原句</b><br>'+escapeHtml(full)+'<br><br><b>结合语境的题干翻译</b><br>'+escapeHtml(q.contextTranslation)+'<br><br><b>为什么选这个</b><br>'+escapeHtml(special)+'<br><br><b>四个选项释义</b><br>'+'ABCD'.split('').map(k=>k+'. '+escapeHtml(q.opts[k])+'：'+escapeHtml(zh[k]||q.opts[k])).join('<br>')+'<br><br><b>其他选项为什么不选</b><br>'+escapeHtml(wrong).replaceAll('\n','<br>');
}
function render(){
 const n=state.sequence.length,pos=state.pos,q=current();
 document.getElementById('done').textContent=state.total;
 document.getElementById('rate').textContent=state.total?Math.round(state.correctTotal/state.total*100)+'%':'—';
 document.getElementById('wrongCount').textContent=state.wrong.length;
 document.getElementById('subtitle').textContent=state.mode==='study'?'顺序背题 · '+qs.length+' 道题':state.mode==='exam'?'随机考试 · '+n+' 道题':`错题复习 · ${n} 道题`;
 document.getElementById('progress').style.width=n?((pos+1)/n*100)+'%':'0%';
 document.querySelectorAll('.toolbar .btn').forEach(b=>b.classList.remove('on'));
 document.getElementById(state.mode==='study'?'study':state.mode==='exam'?'random':'wrong').classList.add('on');
 document.getElementById('wrongShuffle').classList.toggle('hide',state.mode!=='wrong');
 document.getElementById('wrongShuffle').textContent=state.wrongShuffle?'错题顺序':'错题乱序';
 const card=document.getElementById('card');
 if(!q){card.innerHTML='<div class="stem">'+(state.mode==='wrong'?'错题本已清空。':'本轮完成！')+'</div><div class="feedback">'+(state.mode==='exam'?`本轮答对 ${state.runCorrect} / ${state.sequence.length} 题，得分 ${state.runCorrect} 分。`:'可以重新开始，或进入错题本复习。')+'</div><div class="bottom"><button class="btn main" onclick="startStudy()">重新刷题</button><button class="btn" onclick="startRandom()">再考一次</button></div>';return}
 const f=state.feedback;let html=`<div class="meta"><span>${state.mode==='exam'?'考试题':'题目'} ${pos+1} / ${n}</span><span>题号 ${q.num}</span></div><div class="stem">${formatStem(q.stem)}</div><div class="opts">`;
 for(const key of 'ABCD'){
  const selected=f?.selected===key;let cls='opt';if(f&&key===q.ans)cls+=' ok';if(selected&&key!==q.ans)cls+=' no';
  html+=`<button class="${cls}" ${f?'disabled':''} onclick="answer('${key}')"><b>${key}</b><span>${escapeHtml(q.opts[key])}</span></button>`;
 }
 if(f){const ok=f.selected===q.ans;html+=`</div><div class="feedback ${ok?'':'bad'}"><div class="result-title">${ok?'✓ 回答正确':'✕ 回答错误'}</div>${detailedExplanation(q)}</div>`;}
 html+=`<div class="bottom"><button class="btn" onclick="previous()" ${pos===0?'disabled':''}>上一题</button><button class="btn main" onclick="next()">${f&&! (f.selected===q.ans)?'看完答案，下一题':'下一题'}</button></div>`;
 card.innerHTML=html;
}
function answer(key){if(state.feedback)return;const q=current();if(!q)return;const ok=key===q.ans;state.selected=key;state.feedback={selected:key};state.answers[q.num]=key;state.total++;state.runAnswered++;if(ok){state.correctTotal++;state.runCorrect++;state.wrong=state.wrong.filter(n=>n!==q.num)}else if(!state.wrong.includes(q.num)){state.wrong.push(q.num)}save();render();}
function next(){clearTimeout(autoTimer);state.pos++;state.selected=null;state.feedback=null;save();render()}
function previous(){clearTimeout(autoTimer);if(state.pos>0){state.pos--;state.selected=state.answers[state.sequence[state.pos]]||null;state.feedback=state.selected?{selected:state.selected}:null;save();render()}}
document.getElementById('study').onclick=startStudy;document.getElementById('random').onclick=startRandom;document.getElementById('wrong').onclick=startWrong;
document.getElementById('wrongShuffle').onclick=()=>{state.wrongShuffle=!state.wrongShuffle;save();startWrong()};
document.getElementById('restart').onclick=()=>state.mode==='exam'?startRandom():state.mode==='wrong'?startWrong():startStudy();
window.answer=answer;window.next=next;window.previous=previous;window.startStudy=startStudy;window.startRandom=startRandom;
render();
</script></body></html>
