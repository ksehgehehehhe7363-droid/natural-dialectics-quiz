<script>
const qs=[{"num":1,"stem":"I was ______ , but my wife, who was there, told me that when they viewed the cells under a microscope, the doctors started crying because it turned out to be a very rare form of pancreatic cancer that is curable with surgery.","opts":{"A":"imagined","B":"overwhelmed","C":"sedated","D":"triggered"},"ans":"C","explanation":"正确选项是 C（sedated）。填入后的完整句子：I was sedated , but my wife, who was there, told me that when they viewed the cells under a microscope, the doctors started crying because it turned out to be a very rare form of pancreatic cancer that is curable with surgery. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干我当时是______ ，但我在场的妻子告诉我，当他们在显微镜下观察细胞时，医生们开始哭泣，因为它是一种非常罕见的胰腺癌，可以通过手术治愈。\nA.想象\nB.不知所措\nC.镇静\nD.触发"},{"num":2,"stem":"It is impossible to live without failing at something, unless you live so ______ that you might as well not have lived at all.","opts":{"A":"cautiously","B":"paradoxically","C":"academically","D":"tentatively"},"ans":"A","explanation":"正确选项是 A（cautiously）。填入后的完整句子：It is impossible to live without failing at something, unless you live so cautiously that you might as well not have lived at all. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"答题干：不可能不失败地生活，除非你活得如此______ ，以至于你可能根本没有活过。\nA.谨慎\nB.矛盾的是\nC.学术\nD.暂定"},{"num":3,"stem":"One of the many things I learned at the end of that Classics corridor down which I ______ at the age of 18, in search of something I could not define, was written by the Greek author Plutarch: What we achieve inwardly will change outer reality.","opts":{"A":"ventured","B":"endangered","C":"walked","D":"enabled"},"ans":"A","explanation":"正确选项是 A（ventured）。填入后的完整句子：One of the many things I learned at the end of that Classics corridor down which I ventured at the age of 18, in search of something I could not define, was written by the Greek author Plutarch: What we achieve inwardly will change outer reality. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干希腊作家普鲁塔克在18岁时为了寻找一些我无法定义的东西，我在那条经典走廊的尽头学到了很多东西：我们内心所取得的成就将改变外部的现实。\nA.冒险\nB.濒危\nC.步行\nD.已启用"},{"num":4,"stem":"So at 30 I was out. And very publicly out. What had been the focus of my entire adult life was gone, and it was ______ .","opts":{"A":"fascinating","B":"amusing","C":"exhausting","D":"devastating"},"ans":"D","explanation":"正确选项是 D（devastating）。填入后的完整句子：So at 30 I was out. And very publicly out. What had been the focus of my entire adult life was gone, and it was devastating . 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干所以在30岁的时候我出去了。 并且非常公开。 我整个成年生活的焦点都消失了，是______。\nA.迷人\nB.有趣\nC.疲惫不堪\nD.毁灭性的"},{"num":5,"stem":"Reed College at that time ______ perhaps the best calligraphy instruction in the country.","opts":{"A":"fascinated","B":"offered","C":"signed","D":"adapted"},"ans":"B","explanation":"正确选项是 B（offered）。填入后的完整句子：Reed College at that time offered perhaps the best calligraphy instruction in the country. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"里题干德学院当时______也许是全国最好的书法教学。\nA.着迷\nB.提供\nC.已签名\nD.改编"},{"num":6,"stem":"The technology we developed at NeXT is at the heart of Apple's current ______ .","opts":{"A":"innocence","B":"sentence","C":"renaissance","D":"tolerance"},"ans":"C","explanation":"正确选项是 C（renaissance）。填入后的完整句子：The technology we developed at NeXT is at the heart of Apple's current renaissance . 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"答题干：我们在NeXT开发的技术是苹果当前______的核心。\nA.清白\nB.句子\nC.文艺复兴\nD.公差"},{"num":7,"stem":"We all have to decide for ourselves what ______ failure, but the world is quite eager to give you a set of criteria if you let it.","opts":{"A":"conform","B":"conduct","C":"constitute","D":"consistent"},"ans":"C","explanation":"正确选项是 C（constitute）。填入后的完整句子：We all have to decide for ourselves what constitute failure, but the world is quite eager to give you a set of criteria if you let it. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干我们都必须自己决定什么是______失败，但如果你允许的话，这个世界非常渴望给你一套标准。\nA.符合\nB.行为\nC.构成\nD.一致性"},{"num":8,"stem":"My ______ mother later found out that my mother had never graduated from college and that my father had never graduated from high school.","opts":{"A":"technical","B":"physical","C":"chemical","D":"biological"},"ans":"D","explanation":"正确选项是 D（biological）。填入后的完整句子：My biological mother later found out that my mother had never graduated from college and that my father had never graduated from high school. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干我的______母亲后来发现，我母亲从未从大学毕业，我父亲从未从高中毕业。\nA.技术\nB.物理\nC.化学品\nD.生物"},{"num":9,"stem":"At our graduation, we were ______ by enormous affection, by our shared experience of a time that could never come again.","opts":{"A":"bound","B":"united","C":"limited","D":"affected"},"ans":"A","explanation":"正确选项是 A（bound）。填入后的完整句子：At our graduation, we were bound by enormous affection, by our shared experience of a time that could never come again. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"问题干：在我们毕业时，我们被巨大的感情，我们共同经历了一个永远不会再来的时刻。\nA.绑定\nB.联合\nC. LIMITED\nD.受影响"},{"num":10,"stem":"About a year ago I was ______ with cancer.","opts":{"A":"diagnosed","B":"criticized","C":"admitted","D":"suggested"},"ans":"A","explanation":"正确选项是 A（diagnosed）。填入后的完整句子：About a year ago I was diagnosed with cancer. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"问题干：大约一年前，我______得了癌症。\nA.已诊断\nB.批评\nC.已入院\nD.建议"},{"num":11,"stem":"On the back cover of their final issue was a photograph of an early morning country road, the kind you might find yourself ______ on if you were so adventurous","opts":{"A":"hitchhiking","B":"picking","C":"climbing","D":"imposing"},"ans":"A","explanation":"正确选项是 A（hitchhiking）。填入后的完整句子：On the back cover of their final issue was a photograph of an early morning country road, the kind you might find yourself hitchhiking on if you were so adventurous 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干上一篇：他们最后一期的封底是一张清晨乡村公路的照片，如果你喜欢冒险，你可能会发现自己______\nA.搭便车\nB.拣货\nC.攀岩\nD.强加"},{"num":12,"stem":"It means to make sure everything is ______ so that it will be as easy as possible for your family.","opts":{"A":"added up","B":"come up with","C":"burn up","D":"buttoned up"},"ans":"D","explanation":"正确选项是 D（buttoned up）。填入后的完整句子：It means to make sure everything is buttoned up so that it will be as easy as possible for your family. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"答题干：这意味着要确保一切都______ ，以便您的家人尽可能轻松。\nA.加起来\nB.想出\nC.烧坏\nD.扣好扣子"},{"num":13,"stem":"He trembled uncontrollably as he spoke into a video camera about the brutality ______ upon him.","opts":{"A":"hurt","B":"inflicted","C":"done","D":"suffered"},"ans":"B","explanation":"正确选项是 B（inflicted）。填入后的完整句子：He trembled uncontrollably as he spoke into a video camera about the brutality inflicted upon him. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干他无法控制地颤抖着，对着摄像机讲述了______对他的暴行。\nA.受伤\nB.造成的\nC.完成\nD.受苦"},{"num":14,"stem":"We worked hard, and in 10 years Apple had grown into a $2 billion company with over 4,000 ______ .","opts":{"A":"employers","B":"interviewers","C":"employees","D":"interviewees"},"ans":"C","explanation":"正确选项是 C（employees）。填入后的完整句子：We worked hard, and in 10 years Apple had grown into a $2 billion company with over 4,000 employees . 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"问题干：我们努力工作，在10年内，苹果已经成长为一家市值20亿美元的公司，拥有超过4000家公司。\nA.雇主\nB.面试官\nC.员工\nD.受访者"},{"num":15,"stem":"I started a company named NeXT, another company named Pixar, and fell in love with an ______ woman who would become my wife.","opts":{"A":"suffering","B":"referring","C":"amazing3","D":"referring"},"ans":"C","explanation":"正确选项是 C（amazing3）。填入后的完整句子：I started a company named NeXT, another company named Pixar, and fell in love with an amazing3 woman who would become my wife. 该词与空格前后的句子结构和语义相符；其余选项放入此处会造成词义、词性或固定搭配不合。","translation":"题干我创办了一家名为NeXT的公司，另一家名为Pixar的公司，并爱上了一位即将成为我妻子的______女人。\nA.痛苦\nB.转介\nC. amazing3\nD.转介"},{"num":16," const byNum=new Map(qs.map(q=>[q.num,q]));
const KEY='english-choice-quiz-v3';
const initial=()=>({mode:'study',sequence:qs.map(q=>q.num),pos:0,answers:{},wrong:[],total:0,correctTotal:0,runCorrect:0,runAnswered:0,selected:null,feedback:null,wrongShuffle:false});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.sequence)&&s.sequence.length&&s.sequence.every(n=>byNum.has(n)))return {...initial(),...s};}catch(e){}return initial()}
let state=load();let autoTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function shuffled(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function setMode(mode,sequence){clearTimeout(autoTimer);state.mode=mode;state.sequence=sequence;state.pos=0;state.selected=null;state.feedback=null;state.runCorrect=0;state.runAnswered=0;save();render()}
function startStudy(){setMode('study',qs.map(q=>q.num))}
function startRandom(){setMode('exam',shuffled(qs.map(q=>q.num)).slice(0,100))}
function startWrong(){let ids=state.wrong.slice();if(state.wrongShuffle)ids=shuffled(ids);setMode('wrong',ids)}
function current(){return byNum.get(state.sequence[state.pos])}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatStem(s){return escapeHtml(s).replaceAll('______','<span style="display:inline-block;min-width:92px;border-bottom:3px solid #176b57;color:transparent;line-height:1.05;margin:0 4px">______</span>')}
function render(){
 const n=state.sequence.length,pos=state.pos,q=current();
 document.getElementById('done').textContent=state.total;

 document.getElementById('wrongCount').textContent=state.wrong.length;
 document.getElementById('subtitle').textContent=state.mode==='study'?'顺序背题 · '+qs.length+' 道题':state.mode==='exam'?'随机考试 · '+n+' 道题':`错题复习 · ${n} 道题`;
 document.getElementById('progress').style.width=n?((pos+1)/n*100)+'%':'0%';
 document.querySelectorAll('.toolbar .btn').forEach(b=>b.classList.remove('on'));
 document.getElementById(state.mode==='study'?'study':state.mode==='exam'?'random':'wrong').classList.add('on');
 document.getElementById('wrongShuffle').classList.toggle('hide',state.mode!=='wrong');
 document.getElementById('wrongShuffle').textContent=state.wrongShuffle?'错题顺序':'错题乱序';
 const card=document.getElementById('card');
 if(!q){card.innerHTML='<div class="stem">'+(state.mode==='wrong'?'错题本已清空。':'本轮完成！')+'</div><div class="feedback">'+(state.mode==='exam'?`本轮答对 ${state.runCorrect} / ${state.sequence.length} 题，得分 ${state.runCorrect} 分。`:'可以重新开始，或进入错题本复习。')+'</div><div class="bottom"><button class="btn main" onclick="startStudy()">重新刷题</button><button class="btn" onclick="startRandom()">再考一次</button></div>';return}
 const f=state.feedback;let html=`<div class="meta"><span>${state.mode==='exam'?'考试题':'题目'} ${pos+1} / ${n}</span><span>题号 ${q.num}</span></div><div class="stem">${formatStem(q.stem)}</div><div class="opts">`;
 for(const key of 'ABCD'){
  const selected=f?.selected===key;let cls='opt';if(f&&key===q.ans)cls+=' ok';if(selected&&key!==q.ans)cls+=' no';
  html+=`<button class="${cls}" ${f?'disabled':''} onclick="answer('${key}')"><b>${key}</b><span>${escapeHtml(q.opts[key])}</span></button>`;
 }
 if(f){const ok=f.selected===q.ans;html+=`<div class="feedback ${ok?'':'bad'}">${ok?'回答正确！':`<b>回答错误</b><br>正确答案：${q.ans}. ${escapeHtml(q.opts[q.ans])}<br><br><b>题干和选项翻译</b><br>${escapeHtml(q.translation).replaceAll('\n','<br>')}<br><br><b>解析</b><br>${escapeHtml(q.explanation)}`}${ok&&state.mode==='study'?'<br>即将进入下一题。':''}</div>`;}
 html+=`<div class="bottom"><button class="btn" onclick="previous()" ${pos===0?'disabled':''}>上一题</button><button class="btn main" onclick="next()">${f&&! (f.selected===q.ans)?'看完答案，下一题':'下一题'}</button></div>`;
 card.innerHTML=html;
}
function answer(key){if(state.feedback)return;const q=current();if(!q)return;const ok=key===q.ans;state.selected=key;state.feedback={selected:key};state.answers[q.num]=key;state.total++;state.runAnswered++;if(ok){state.correctTotal++;state.runCorrect++;state.wrong=state.wrong.filter(n=>n!==q.num)}else if(!state.wrong.includes(q.num)){state.wrong.push(q.num)}save();render();if(ok&&state.mode==='study'){const num=q.num;autoTimer=setTimeout(()=>{if(state.feedback&&current()?.num===num)next()},850)}}
function next(){clearTimeout(autoTimer);state.pos++;state.selected=null;state.feedback=null;save();render()}
function previous(){clearTimeout(autoTimer);if(state.pos>0){state.pos--;state.selected=state.answers[state.sequence[state.pos]]||null;state.feedback=state.selected?{selected:state.selected}:null;save();render()}}
document.getElementById('study').onclick=startStudy;document.getElementById('random').onclick=startRandom;document.getElementById('wrong').onclick=startWrong;
document.getElementById('wrongShuffle').onclick=()=>{state.wrongShuffle=!state.wrongShuffle;save();startWrong()};
document.getElementById('restart').onclick=()=>state.mode==='exam'?startRandom():state.mode==='wrong'?startWrong():startStudy();
window.answer=answer;window.next=next;window.previous=previous;window.startStudy=startStudy;window.startRandom=startRandom;
render();
</script></body></html>
