const byNum=new Map(qs.map(q=>[q.num,q]));
const KEY='english-choice-quiz-v3';
const initial=()=>({mode:'study',sequence:qs.map(q=>q.num),pos:0,answers:{},wrong:[],total:0,correctTotal:0,runCorrect:0,runAnswered:0,selected:null,feedback:null,wrongShuffle:false});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.sequence)&&s.sequence.length&&s.sequence.every(n=>byNum.has(n)))return {...initial(),...s};}catch(e){}return initial()}
let state=load();let autoTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function shuffled(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function setMode(mode,sequence){clearTimeout(autoTimer);state.mode=mode;state.sequence=sequence;state.pos=0;state.selected=null;state.feedback=null;state.runCorrect=0;state.runAnswered=0;save();render()}
function startStudy(){setMode('study',qs.map(q=>q.num))}
function startRandom(){setMode('exam',shuffled(qs.map(q=>q.num)).slice(0,100))}
function startWrong(){let ids=state.wrong.slice();if(state.wrongShuffle)ids=shuffled(ids);setMode('wrong',ids)}
function current(){return byNum.get(state.sequence[state.pos])}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 const n=state.sequence.length,pos=state.pos,q=current();
 document.getElementById('done').textContent=state.total;
 document.getElementById('rate').textContent=state.total?Math.round(state.correctTotal/state.total*100)+'%':'—';
 document.getElementById('wrongCount').textContent=state.wrong.length;
 document.getElementById('subtitle').textContent=state.mode==='study'?'顺序背题 · '+qs.length+' 道题':state.mode==='exam'?'随机考试 · '+n+' 道题':`错题复习 · ${n} 道题`;
 document.getElementById('progress').style.width=n?((pos+1)/n*100)+'%':'0%';
 document.querySelectorAll('.toolbar .btn').forEach(b=>b.classList.remove('on'));
 document.getElementById(state.mode==='study'?'study':state.mode==='exam'?'random':'wrong').classList.add('on');
 document.getElementById('wrongShuffle').classList.toggle('hide',state.mode!=='wrong');
 document.getElementById('wrongShuffle').textContent=state.wrongShuffle?'错题顺序':'错题乱序';
 const card=document.getElementById('card');
 if(!q){card.innerHTML='<div class="stem">'+(state.mode==='wrong'?'错题本已清空。':'本轮完成！')+'</div><div class="feedback">'+(state.mode==='exam'?`本轮答对 ${state.runCorrect} / ${state.sequence.length} 题，得分 ${state.runCorrect} 分。`:'可以重新开始，或进入错题本复习。')+'</div><div class="bottom"><button class="btn main" onclick="startStudy()">重新刷题</button><button class="btn" onclick="startRandom()">再考一次</button></div>';return}
 const f=state.feedback;let html=`<div class="meta"><span>${state.mode==='exam'?'考试题':'题目'} ${pos+1} / ${n}</span><span>题号 ${q.num}</span></div><div class="stem">${escapeHtml(q.stem)}</div><div class="opts">`;
 for(const key of 'ABCD'){
  const selected=f?.selected===key;let cls='opt';if(f&&key===q.ans)cls+=' ok';if(selected&&key!==q.ans)cls+=' no';
  html+=`<button class="${cls}" ${f?'disabled':''} onclick="answer('${key}')"><b>${key}</b><span>${escapeHtml(q.opts[key])}</span></button>`;
 }
 if(f){const ok=f.selected===q.ans;html+=`<div class="feedback ${ok?'':'bad'}">${ok?'回答正确！':`回答错误。正确答案：${q.ans}. ${escapeHtml(q.opts[q.ans])}`}${ok&&state.mode==='study'?'<br>即将进入下一题。':''}</div>`;}
 html+=`<div class="bottom"><button class="btn" onclick="previous()" ${pos===0?'disabled':''}>上一题</button><button class="btn main" onclick="next()">${f&&! (f.selected===q.ans)?'看完答案，下一题':'下一题'}</button></div>`;
 card.innerHTML=html;
}
function answer(key){if(state.feedback)return;const q=current();if(!q)return;const ok=key===q.ans;state.selected=key;state.feedback={selected:key};state.answers[q.num]=key;state.total++;state.runAnswered++;if(ok){state.correctTotal++;state.runCorrect++;state.wrong=state.wrong.filter(n=>n!==q.num)}else if(!state.wrong.includes(q.num)){state.wrong.push(q.num)}save();render();if(ok&&state.mode==='study'){const num=q.num;autoTimer=setTimeout(()=>{if(state.feedback&&current()?.num===num)next()},850)}}
function next(){clearTimeout(autoTimer);state.pos++;state.selected=null;state.feedback=null;save();render()}
function previous(){clearTimeout(autoTimer);if(state.pos>0){state.pos--;state.selected=state.answers[state.sequence[state.pos]]||null;state.feedback=state.selected?{selected:state.selected}:null;save();render()}}
document.getElementById('study').onclick=startStudy;document.getElementById('random').onclick=startRandom;document.getElementById('wrong').onclick=startWrong;
document.getElementById('wrongShuffle').onclick=()=>{state.wrongShuffle=!state.wrongShuffle;save();startWrong()};
document.getElementById('restart').onclick=()=>state.mode==='exam'?startRandom():state.mode==='wrong'?startWrong():startStudy();
window.answer=answer;window.next=next;window.previous=previous;window.startStudy=startStudy;window.startRandom=startRandom;
render();
</script></body></html>
